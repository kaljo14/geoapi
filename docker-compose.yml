services:
  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: geopulse
      POSTGRES_PASSWORD: geopulse
      POSTGRES_DB: geopulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geopulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  martin:
    image: ghcr.io/maplibre/martin:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://geopulse:geopulse@postgres:5432/geopulse
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
