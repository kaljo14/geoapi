openapi: 3.0.0
info:
  title: Geopulse
  version: 0.0.0
tags: []
paths:
  /api/heatmap:
    get:
      operationId: Heatmap_get
      summary: Opportunity heatmap
      description: Returns opportunity score grid over a bounding box.
      parameters:
        - name: min_lat
          in: query
          required: true
          schema:
            type: number
            format: double
          explode: false
        - name: min_lng
          in: query
          required: true
          schema:
            type: number
            format: double
          explode: false
        - name: max_lat
          in: query
          required: true
          schema:
            type: number
            format: double
          explode: false
        - name: max_lng
          in: query
          required: true
          schema:
            type: number
            format: double
          explode: false
        - name: cell_size
          in: query
          required: false
          schema:
            type: number
            format: double
          explode: false
        - name: category
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HeatmapTile'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/metro/shapes:
    get:
      operationId: MetroShapes_get
      summary: Metro shapes
      description: Returns metro line shapes as GeoJSON FeatureCollection.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJSONFeatureCollection'
  /api/metro/stops:
    get:
      operationId: MetroStops_get
      summary: Metro stops
      description: Returns metro stops as GeoJSON FeatureCollection.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJSONFeatureCollection'
  /api/places:
    get:
      operationId: Places_list
      summary: List places
      description: Returns all places, optionally filtered by category and/or tag.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: tag
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
    post:
      operationId: Places_create
      summary: Create place
      description: Creates a new place manually.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaceRequest'
  /api/places/{place_id}:
    get:
      operationId: PlaceByID_get
      summary: Get place
      description: Returns a single place by ID.
      parameters:
        - name: place_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: PlaceByID_update
      summary: Update place
      description: Updates a place by ID.
      parameters:
        - name: place_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaceRequest'
    delete:
      operationId: PlaceByID_delete
      summary: Delete place
      description: Deletes a place by ID.
      parameters:
        - name: place_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/saturation:
    get:
      operationId: Saturation_get
      summary: Saturation score
      description: Returns competitor density score at a given point.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
          explode: false
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
          explode: false
        - name: radius
          in: query
          required: false
          schema:
            type: number
            format: double
          explode: false
        - name: category
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaturationResult'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /enrich:
    post:
      operationId: Enrich_create
      summary: Trigger enricher
      description: Starts a background Google Places details enricher job.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /livez:
    get:
      operationId: Livez_get
      summary: Liveness probe
      description: Always returns 200 OK.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivezResponse'
  /readyz:
    get:
      operationId: Readyz_get
      summary: Readiness probe
      description: Returns 200 if the service is ready. Returns 503 otherwise.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
  /scrape:
    post:
      operationId: Scrape_create
      summary: Trigger scraper
      description: Starts a background Google Places scraper job.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
components:
  schemas:
    CreatePlaceRequest:
      type: object
      required:
        - name
        - lat
        - lng
      properties:
        name:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        address:
          type: string
        rating:
          type: number
          format: double
        business_status:
          type: string
        category:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    GeoJSONFeatureCollection:
      type: object
      required:
        - type
        - features
      properties:
        type:
          type: string
        features:
          type: array
          items: {}
    HeatmapTile:
      type: object
      required:
        - lat
        - lng
        - anchor_score
        - comp_penalty
        - score
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        anchor_score:
          type: number
          format: double
        comp_penalty:
          type: number
          format: double
        score:
          type: number
          format: double
    LivezResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    Place:
      type: object
      required:
        - place_id
        - name
        - lat
        - lng
      properties:
        place_id:
          type: string
        name:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        rating:
          type: number
          format: double
        business_status:
          type: string
        website:
          type: string
        formatted_phone_number:
          type: string
        international_phone_number:
          type: string
        opening_hours:
          type: string
        reviews:
          type: string
        editorial_summary:
          type: string
        photos:
          type: string
        types:
          type: string
        price_level:
          type: integer
          format: int32
        user_ratings_total:
          type: integer
          format: int32
        utc_offset_minutes:
          type: integer
          format: int32
        google_maps_url:
          type: string
        icon_url:
          type: string
        curbside_pickup:
          type: boolean
        delivery:
          type: boolean
        dine_in:
          type: boolean
        reservable:
          type: boolean
        takeout:
          type: boolean
        wheelchair_accessible:
          type: boolean
        category:
          type: string
        tags:
          type: string
        scraped_at:
          type: string
    ReadyzResponse:
      type: object
      required:
        - status
        - db
      properties:
        status:
          type: string
        db:
          type: string
    SaturationResult:
      type: object
      required:
        - lat
        - lng
        - radius_meters
        - competitor_count
        - density_per_km2
        - score
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        radius_meters:
          type: number
          format: double
        category:
          type: string
        competitor_count:
          type: integer
          format: int32
        density_per_km2:
          type: number
          format: double
        score:
          type: number
          format: double
    UpdatePlaceRequest:
      type: object
      required:
        - name
        - lat
        - lng
      properties:
        name:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        address:
          type: string
        rating:
          type: number
          format: double
        business_status:
          type: string
        category:
          type: string
servers:
  - url: http://localhost:8080
    description: Local development server
    variables: {}
