openapi: 3.0.0
info:
  title: Geopulse
  version: 0.0.0
tags: []
paths:
  /api/heatmap:
    get:
      operationId: Heatmap_get
      summary: Opportunity heatmap
      description: Returns opportunity score grid over a bounding box.
      parameters:
        - name: min_lat
          in: query
          required: true
          schema:
            type: number
            format: double
          explode: false
        - name: min_lng
          in: query
          required: true
          schema:
            type: number
            format: double
          explode: false
        - name: max_lat
          in: query
          required: true
          schema:
            type: number
            format: double
          explode: false
        - name: max_lng
          in: query
          required: true
          schema:
            type: number
            format: double
          explode: false
        - name: cell_size
          in: query
          required: false
          schema:
            type: number
            format: double
          explode: false
        - name: category
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HeatmapTile'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/metro/shapes:
    get:
      operationId: MetroShapes_get
      summary: Metro shapes
      description: Returns metro line shapes as GeoJSON FeatureCollection.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJSONFeatureCollection'
  /api/metro/stops:
    get:
      operationId: MetroStops_get
      summary: Metro stops
      description: Returns metro stops as GeoJSON FeatureCollection.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJSONFeatureCollection'
  /api/osm/import:
    post:
      operationId: OSM_trigger
      summary: Trigger OSM network import
      description: Starts a background OpenStreetMap pedestrian network import and walkability scoring job for Sofia.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/osm/pois:
    post:
      operationId: OSM_pois
      summary: Trigger OSM POI import
      description: Starts a background OpenStreetMap POI import (amenity, shop, tourism, leisure) and walk score recomputation for Sofia.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/parking-zones:
    get:
      operationId: ParkingZones_get
      summary: Parking zones
      description: Returns Sofia paid parking zones as GeoJSON FeatureCollection with zone_id, name, and color properties.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJSONFeatureCollection'
  /api/places:
    get:
      operationId: Places_list
      summary: List places
      description: Returns all places, optionally filtered by category and/or tag.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: tag
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
    post:
      operationId: Places_create
      summary: Create place
      description: Creates a new place manually.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaceRequest'
  /api/places/{place_id}:
    get:
      operationId: PlaceByID_get
      summary: Get place
      description: Returns a single place by ID.
      parameters:
        - name: place_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: PlaceByID_update
      summary: Update place
      description: Updates a place by ID.
      parameters:
        - name: place_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlaceRequest'
    delete:
      operationId: PlaceByID_delete
      summary: Delete place
      description: Deletes a place by ID.
      parameters:
        - name: place_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/retail-listings:
    get:
      operationId: RetailListings_list
      summary: List retail listings
      description: Returns all retail/commercial open location listings.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RetailListing'
    post:
      operationId: RetailListings_create
      summary: Create retail listing
      description: Creates a new retail/commercial location listing.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailListing'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRetailListingRequest'
  /api/retail-listings/{id}:
    get:
      operationId: RetailListingByID_get
      summary: Get retail listing
      description: Returns a single retail listing by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailListing'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: RetailListingByID_update
      summary: Update retail listing
      description: Updates a retail listing by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailListing'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRetailListingRequest'
    delete:
      operationId: RetailListingByID_delete
      summary: Delete retail listing
      description: Deletes a retail listing by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/saturation:
    get:
      operationId: Saturation_get
      summary: Saturation score
      description: Returns competitor density score at a given point.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
          explode: false
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
          explode: false
        - name: radius
          in: query
          required: false
          schema:
            type: number
            format: double
          explode: false
        - name: category
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaturationResult'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sofiaplan/context:
    get:
      operationId: SofiaPlan_context
      summary: Location context
      description: Returns zoning, income, metro catchment, and pedestrian data for a given lat/lng point.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
          explode: false
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationContext'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/sofiaplan/import:
    post:
      operationId: SofiaPlan_trigger
      summary: Trigger SofiaПлан import
      description: Starts a background import of SofiaПлан datasets. Pass `layer=<table_name>` to import a single layer, or `all=true` (default) to import every layer.
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: boolean
          explode: false
        - name: layer
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /enrich:
    post:
      operationId: Enrich_create
      summary: Trigger enricher
      description: Starts a background Google Places details enricher job.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /livez:
    get:
      operationId: Livez_get
      summary: Liveness probe
      description: Always returns 200 OK.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivezResponse'
  /readyz:
    get:
      operationId: Readyz_get
      summary: Readiness probe
      description: Returns 200 if the service is ready. Returns 503 otherwise.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
  /scrape:
    post:
      operationId: Scrape_create
      summary: Trigger scraper
      description: Starts a background Google Places scraper job.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
components:
  schemas:
    CreatePlaceRequest:
      type: object
      required:
        - name
        - lat
        - lng
      properties:
        name:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        address:
          type: string
        rating:
          type: number
          format: double
        business_status:
          type: string
        category:
          type: string
    CreateRetailListingRequest:
      type: object
      required:
        - title
        - lat
        - lng
        - is_exact
      properties:
        title:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        address:
          type: string
        size_sqm:
          type: number
          format: double
        price_eur:
          type: number
          format: double
        listing_url:
          type: string
        google_maps_url:
          type: string
        is_exact:
          type: boolean
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    GeoJSONFeatureCollection:
      type: object
      required:
        - type
        - features
      properties:
        type:
          type: string
        features:
          type: array
          items: {}
    HeatmapTile:
      type: object
      required:
        - lat
        - lng
        - anchor_score
        - comp_penalty
        - score
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        anchor_score:
          type: number
          format: double
        comp_penalty:
          type: number
          format: double
        score:
          type: number
          format: double
    LivezResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    LocationContext:
      type: object
      required:
        - lat
        - lng
        - in_metro_catchment
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        in_metro_catchment:
          type: boolean
        zoning_properties:
          type: object
          additionalProperties: {}
        income_properties:
          type: object
          additionalProperties: {}
        metro_catchment_properties:
          type: object
          additionalProperties: {}
        pedestrian_properties:
          type: object
          additionalProperties: {}
        population_properties:
          type: object
          additionalProperties: {}
        property_price_properties:
          type: object
          additionalProperties: {}
        business_turnover_properties:
          type: object
          additionalProperties: {}
        development_potential_properties:
          type: object
          additionalProperties: {}
        neighborhood_properties:
          type: object
          additionalProperties: {}
        building_density_ge_properties:
          type: object
          additionalProperties: {}
        building_footprint_ge_properties:
          type: object
          additionalProperties: {}
        residential_typology_ge_properties:
          type: object
          additionalProperties: {}
        urban_morphology_ge_properties:
          type: object
          additionalProperties: {}
        flood_risk_low_properties:
          type: object
          additionalProperties: {}
        flood_risk_medium_properties:
          type: object
          additionalProperties: {}
        flood_risk_high_properties:
          type: object
          additionalProperties: {}
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    Place:
      type: object
      required:
        - place_id
        - name
        - lat
        - lng
      properties:
        place_id:
          type: string
        name:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        rating:
          type: number
          format: double
        business_status:
          type: string
        website:
          type: string
        formatted_phone_number:
          type: string
        international_phone_number:
          type: string
        opening_hours:
          type: string
        reviews:
          type: string
        editorial_summary:
          type: string
        photos:
          type: string
        types:
          type: string
        price_level:
          type: integer
          format: int32
        user_ratings_total:
          type: integer
          format: int32
        utc_offset_minutes:
          type: integer
          format: int32
        google_maps_url:
          type: string
        icon_url:
          type: string
        curbside_pickup:
          type: boolean
        delivery:
          type: boolean
        dine_in:
          type: boolean
        reservable:
          type: boolean
        takeout:
          type: boolean
        wheelchair_accessible:
          type: boolean
        category:
          type: string
        tags:
          type: string
        scraped_at:
          type: string
        estimated_monthly_visitors:
          type: integer
          format: int32
        visitor_location_score:
          type: number
          format: double
    ReadyzResponse:
      type: object
      required:
        - status
        - db
      properties:
        status:
          type: string
        db:
          type: string
    RetailListing:
      type: object
      required:
        - id
        - title
        - lat
        - lng
        - is_exact
      properties:
        id:
          type: string
        title:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        size_sqm:
          type: number
          format: double
        price_eur:
          type: number
          format: double
        listing_url:
          type: string
        google_maps_url:
          type: string
        is_exact:
          type: boolean
        created_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    SaturationResult:
      type: object
      required:
        - lat
        - lng
        - radius_meters
        - competitor_count
        - density_per_km2
        - score
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        radius_meters:
          type: number
          format: double
        category:
          type: string
        competitor_count:
          type: integer
          format: int32
        density_per_km2:
          type: number
          format: double
        score:
          type: number
          format: double
    UpdatePlaceRequest:
      type: object
      required:
        - name
        - lat
        - lng
      properties:
        name:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        address:
          type: string
        rating:
          type: number
          format: double
        business_status:
          type: string
        category:
          type: string
    UpdateRetailListingRequest:
      type: object
      properties:
        title:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        size_sqm:
          type: number
          format: double
        price_eur:
          type: number
          format: double
        listing_url:
          type: string
        google_maps_url:
          type: string
        is_exact:
          type: boolean
servers:
  - url: http://localhost:8080
    description: Local development server
    variables: {}
